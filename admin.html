<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | Hogar Por Favor</title><link rel="icon" type="image/png" href="favicon.png?v=3"><link rel="stylesheet" href="style.css?v=6"><link rel="stylesheet" href="admin.css?v=1"><script src="admin.js?v=1" defer></script></head><body class="admin-page"><header><a class="brand" href="/"><img src="logo.png?v=2" alt="Hogar Por Favor" width="220" height="50"></a><span class="admin-label">ADMINISTRACIÓN</span><a class="text-link" href="/">Ver sitio ↗</a></header><main class="admin-main"><section id="admin-access"><span class="eyebrow">ACCESO RESERVADO</span><h1>Administra tu comunidad.</h1><p>Panel exclusivo de la cuenta superadmin con correo confirmado.</p><form id="admin-login"><label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button class="button full">Entrar al panel ↗</button></form><p id="access-status" role="status"></p><a href="/" class="plain">Confirmar mi correo o recuperar mi contraseña</a><button type="button" id="access-logout" class="plain" hidden>Cerrar la sesión actual</button></section><section id="admin-workspace" hidden><div class="admin-heading"><div><span class="eyebrow">HOGAR POR FAVOR</span><h1>Panel de administración.</h1><p id="admin-identity"></p></div><button id="admin-logout" class="plain">Cerrar sesión</button></div><div id="admin-summary" class="admin-summary"></div><nav class="admin-tabs" aria-label="Secciones de administración"><button data-tab="users" class="selected">Usuarios</button><button data-tab="properties">Publicaciones</button><button data-tab="reports">Reportes</button><button data-tab="audit">Historial</button></nav><form id="admin-filters" class="admin-filters"><label><span id="query-label">Buscar usuario</span><input id="admin-query" placeholder="Nombre o correo" maxlength="100"></label><label id="status-label" hidden>Estado<select id="admin-status"></select></label><button class="button" type="submit">Buscar ↗</button></form><p id="admin-notice" role="status"></p><div id="admin-content" class="admin-content"></div><div id="admin-pagination" class="pagination"></div></section></main><dialog id="admin-editor" class="wide-dialog" aria-labelledby="editor-title"><button type="button" class="close" id="editor-close" aria-label="Cerrar">×</button><h2 id="editor-title">Revisar publicación.</h2><p id="editor-owner"></p><div id="editor-photos" class="photo-preview"></div><form id="admin-edit-form"><input type="hidden" name="id"><label>Título<input name="title" required minlength="8" maxlength="100"></label><label>Precio en MXN<input name="price" type="number" min="1" max="1000000000" required></label><div class="form-grid"><label>Estado<input name="state" required maxlength="70"></label><label>Ciudad o municipio<input name="city" required maxlength="100"></label></div><label>Colonia<input name="neighborhood" maxlength="100"></label><label>Descripción<textarea name="description" rows="5" minlength="30" maxlength="5000" required></textarea></label><button class="button full">Guardar correcciones</button><p id="editor-status" role="status"></p></form></dialog></body></html>
